[package]
name = "printcraft-redact"
description = "Redaction (architecture §11.2): marks, apply (glyphs, images, vectors, XObjects, annotations, fields), verification"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "1"
printcraft-cos = { workspace = true }
printcraft-content = { workspace = true }
printcraft-fonts = { workspace = true }
# The usable-quad rule `/QuadPoints` readers share.
printcraft-geom = { workspace = true }
printcraft-model = { workspace = true }
printcraft-forms = { workspace = true }
printcraft-edit = { workspace = true }
printcraft-annot = { workspace = true }
printcraft-xfa = { workspace = true }
# CCITT Group 4 and JBIG2 encoding for cleared one-bit images.
printcraft-filters = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# NFKC for the metadata check; already in the build through printcraft-crypt (stringprep).
unicode-normalization = "0.1"
# Reads the PDF/A and PDF/UA identification by namespace; already in the build through printcraft-xfa.
roxmltree = "0.21"
sha2 = "0.11"

[dev-dependencies]
printcraft-testkit = { workspace = true }
# The redacted page is rendered in `tests::a_page_whose_pruned_pattern_is_still_selected_renders`:
# layer 3 from layer 4, a dev dependency only.
printcraft-render = { workspace = true }
