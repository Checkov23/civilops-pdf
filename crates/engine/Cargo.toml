[package]
name = "printcraft-engine"
description = "CivilOps PDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
printcraft-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
printcraft-render = { workspace = true }
printcraft-cos = { workspace = true }
printcraft-organize = { workspace = true }
printcraft-annot = { workspace = true }
printcraft-forms = { workspace = true }
printcraft-xfa = { workspace = true }
printcraft-edit = { workspace = true }
printcraft-audit = { workspace = true }
printcraft-redact = { workspace = true }
printcraft-print = { workspace = true }
printcraft-xfdf = { workspace = true }
printcraft-sign = { workspace = true }
printcraft-optimize = { workspace = true }
printcraft-a11y = { workspace = true }
printcraft-ocr = { workspace = true }
printcraft-js = { workspace = true }
printcraft-compare = { workspace = true }
printcraft-preflight = { workspace = true }
printcraft-export = { workspace = true }
printcraft-fonts = { workspace = true }
printcraft-create = { workspace = true }
printcraft-model = { workspace = true }
printcraft-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and printcraft-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
