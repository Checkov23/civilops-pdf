[package]
name = "printcraft-cli"
description = "CivilOps PDF command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "printcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
printcraft-render = { workspace = true }
serde_json = { workspace = true }
printcraft-engine = { workspace = true }
printcraft-audit = { workspace = true }
printcraft-cos = { workspace = true }
printcraft-preflight = { workspace = true }
printcraft-automation = { workspace = true }
printcraft-platform = { workspace = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for printcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`printcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["printcraft-automation/mcp"]
